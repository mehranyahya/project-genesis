name: Generate security lock candidate

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/security-lock-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup the project's pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Generate lockfile candidate without package scripts
        run: |
          bun install --help
          bun install --lockfile-only --ignore-scripts
          git diff --exit-code -- package.json
      - name: Emit public lockfile candidate for review
        run: |
          bun -e '
          const text = JSON.stringify(await Bun.file("bun.lock").text());
          const size = 6000;
          console.log("GENESIS_LOCK_PARTS=" + Math.ceil(text.length / size));
          for (let i = 0; i < text.length; i += size) {
            console.log("GENESIS_LOCK_PART_" + String(i / size).padStart(3, "0") + "=" + text.slice(i, i + size));
          }
          '
      - name: Audit candidate dependency resolution
        run: bun run security:audit
