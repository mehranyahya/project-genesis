name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production
      production_confirmation:
        description: Type DEPLOY_PRODUCTION for a production deployment
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: ${{ inputs.target == 'preview' }}
    uses: ./.github/workflows/deploy-cloudflare-reusable.yml
    with:
      target: preview
      production_confirmation: ""
      public_site_origin: ""
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.PREVIEW_VITE_TURNSTILE_SITE_KEY }}
      SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
      REQUEST_FINGERPRINT_KEY: ${{ secrets.PREVIEW_REQUEST_FINGERPRINT_KEY }}
      REQUEST_FINGERPRINT_KEY_ID: ${{ secrets.PREVIEW_REQUEST_FINGERPRINT_KEY_ID }}
      IP_HASH_KEY: ${{ secrets.PREVIEW_IP_HASH_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.PREVIEW_TURNSTILE_SECRET_KEY }}
      TURNSTILE_ALLOWED_HOSTNAMES: ${{ secrets.PREVIEW_TURNSTILE_ALLOWED_HOSTNAMES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.PREVIEW_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.PREVIEW_TELEGRAM_ADMIN_CHAT_ID }}

  production:
    if: ${{ inputs.target == 'production' }}
    uses: ./.github/workflows/deploy-cloudflare-reusable.yml
    with:
      target: production
      production_confirmation: ${{ inputs.production_confirmation }}
      public_site_origin: ${{ vars.PRODUCTION_PUBLIC_SITE_ORIGIN }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.PRODUCTION_VITE_TURNSTILE_SITE_KEY }}
      SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      REQUEST_FINGERPRINT_KEY: ${{ secrets.PRODUCTION_REQUEST_FINGERPRINT_KEY }}
      REQUEST_FINGERPRINT_KEY_ID: ${{ secrets.PRODUCTION_REQUEST_FINGERPRINT_KEY_ID }}
      IP_HASH_KEY: ${{ secrets.PRODUCTION_IP_HASH_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.PRODUCTION_TURNSTILE_SECRET_KEY }}
      TURNSTILE_ALLOWED_HOSTNAMES: ${{ secrets.PRODUCTION_TURNSTILE_ALLOWED_HOSTNAMES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.PRODUCTION_TELEGRAM_ADMIN_CHAT_ID }}
