name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production
      content_confirmation:
        description: Type CONTENT_FINALIZED after reviewed content and Catalog are loaded
        required: true
        type: string
      migration_confirmation:
        description: Type MIGRATIONS_VERIFIED_AFTER_BACKUP after the ordered DB gate
        required: true
        type: string
      production_confirmation:
        description: Type DEPLOY_PRODUCTION for a production deployment
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: ${{ inputs.deploy_target == 'preview' }}
    uses: ./.github/workflows/deploy-cloudflare-reusable.yml
    with:
      target: preview
      content_confirmation: ${{ inputs.content_confirmation }}
      migration_confirmation: ${{ inputs.migration_confirmation }}
      production_confirmation: ${{ inputs.production_confirmation }}
      site_url: ${{ vars.PREVIEW_SITE_URL }}
      allowed_origins: ${{ vars.PREVIEW_ALLOWED_ORIGINS }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.PREVIEW_VITE_TURNSTILE_SITE_KEY }}
      SUPABASE_FUNCTION_BASE_URL: ${{ secrets.PREVIEW_SUPABASE_FUNCTION_BASE_URL }}
      EDGE_GATEWAY_KEYS_JSON: ${{ secrets.PREVIEW_EDGE_GATEWAY_KEYS_JSON }}
      EDGE_GATEWAY_PRIMARY_KEY_ID: ${{ secrets.PREVIEW_EDGE_GATEWAY_PRIMARY_KEY_ID }}
      IP_HASH_SECRET: ${{ secrets.PREVIEW_IP_HASH_SECRET }}

  production:
    if: ${{ inputs.deploy_target == 'production' }}
    uses: ./.github/workflows/deploy-cloudflare-reusable.yml
    with:
      target: production
      content_confirmation: ${{ inputs.content_confirmation }}
      migration_confirmation: ${{ inputs.migration_confirmation }}
      production_confirmation: ${{ inputs.production_confirmation }}
      site_url: ${{ vars.PRODUCTION_SITE_URL }}
      allowed_origins: ${{ vars.PRODUCTION_ALLOWED_ORIGINS }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.PRODUCTION_VITE_TURNSTILE_SITE_KEY }}
      SUPABASE_FUNCTION_BASE_URL: ${{ secrets.PRODUCTION_SUPABASE_FUNCTION_BASE_URL }}
      EDGE_GATEWAY_KEYS_JSON: ${{ secrets.PRODUCTION_EDGE_GATEWAY_KEYS_JSON }}
      EDGE_GATEWAY_PRIMARY_KEY_ID: ${{ secrets.PRODUCTION_EDGE_GATEWAY_PRIMARY_KEY_ID }}
      IP_HASH_SECRET: ${{ secrets.PRODUCTION_IP_HASH_SECRET }}
