name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated content artifact
        run: bun run content:check

      - name: Verify canonical public catalog placeholder
        run: bun run catalog:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Check Supabase Edge Functions
        run: bun run edge:check

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Prepare Cloudflare deploy config
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Verify Cloudflare deploy artifact
        run: node scripts/verify-cloudflare-deploy.mjs

      - name: Dry-run generated Worker
        run: >-
          bunx wrangler deploy
          --config .output/server/wrangler.json
          --dry-run
          --strict
          --outdir "$RUNNER_TEMP/wrangler-dry-run"
