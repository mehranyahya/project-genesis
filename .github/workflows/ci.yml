name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Prepare Cloudflare deploy config
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Verify Cloudflare deploy artifact
        run: node scripts/verify-cloudflare-deploy.mjs
