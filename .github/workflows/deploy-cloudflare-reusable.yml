name: Cloudflare deployment implementation

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      content_confirmation:
        required: true
        type: string
      migration_confirmation:
        required: true
        type: string
      production_confirmation:
        required: true
        type: string
      site_url:
        required: true
        type: string
      allowed_origins:
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      VITE_TURNSTILE_SITE_KEY:
        required: true
      SUPABASE_FUNCTION_BASE_URL:
        required: true
      EDGE_GATEWAY_KEYS_JSON:
        required: true
      EDGE_GATEWAY_PRIMARY_KEY_ID:
        required: true
      IP_HASH_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate manual deployment request
        shell: bash
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          CONTENT_CONFIRMATION: ${{ inputs.content_confirmation }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          SITE_URL: ${{ inputs.site_url }}
          ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TARGET" == "preview" || "$DEPLOY_TARGET" == "production" ]] || {
            echo "Deployment target is invalid." >&2
            exit 1
          }
          [[ "$CONTENT_CONFIRMATION" == "CONTENT_FINALIZED" ]] || {
            echo "Reviewed content and Catalog have not been confirmed." >&2
            exit 1
          }
          [[ "$MIGRATION_CONFIRMATION" == "MIGRATIONS_VERIFIED_AFTER_BACKUP" ]] || {
            echo "Ordered migrations have not been confirmed after backup." >&2
            exit 1
          }
          [[ -n "$SITE_URL" && -n "$ALLOWED_ORIGINS" ]] || {
            echo "Target SITE_URL or ALLOWED_ORIGINS is missing." >&2
            exit 1
          }
          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Production deployment is allowed only from main." >&2
              exit 1
            }
            [[ "$PRODUCTION_CONFIRMATION" == "DEPLOY_PRODUCTION" ]] || {
              echo "Production deployment confirmation is invalid." >&2
              exit 1
            }
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated content artifact
        run: bun run content:check

      - name: Enforce release content gate
        run: bun run content:release-check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Check Supabase Edge Functions
        run: bun run edge:check

      - name: Tests
        run: bun test

      - name: Validate public build configuration
        shell: bash
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$VITE_TURNSTILE_SITE_KEY" ]] || {
            echo "VITE_TURNSTILE_SITE_KEY is not configured for this target." >&2
            exit 1
          }

      - name: Prepare deployment indexing policy
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/prepare-deploy-indexing.mjs "$DEPLOY_TARGET"

      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_SITE_URL: ${{ inputs.site_url }}
        run: bun run build

      - name: Prepare Cloudflare deploy config
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          SITE_URL: ${{ inputs.site_url }}
          ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Verify Cloudflare deploy artifact
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          SITE_URL: ${{ inputs.site_url }}
          ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
        run: node scripts/verify-cloudflare-deploy.mjs

      - name: Write narrow Worker secret file
        env:
          SUPABASE_FUNCTION_BASE_URL: ${{ secrets.SUPABASE_FUNCTION_BASE_URL }}
          EDGE_GATEWAY_KEYS_JSON: ${{ secrets.EDGE_GATEWAY_KEYS_JSON }}
          EDGE_GATEWAY_PRIMARY_KEY_ID: ${{ secrets.EDGE_GATEWAY_PRIMARY_KEY_ID }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
        run: node scripts/write-cloudflare-secrets.mjs "$RUNNER_TEMP/cloudflare-runtime-secrets.json"

      - name: Validate Cloudflare CI credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo "Cloudflare credentials are not configured for this target." >&2
            exit 1
          }

      - name: Dry-run generated Worker
        run: >-
          bunx wrangler deploy
          --config .output/server/wrangler.json
          --dry-run
          --strict
          --outdir "$RUNNER_TEMP/wrangler-dry-run"

      - name: Upload stable preview version without promotion
        if: ${{ inputs.target == 'preview' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          bunx wrangler versions upload
          --config .output/server/wrangler.json
          --secrets-file "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
          --preview-alias staging
          --keep-vars
          --strict

      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          bunx wrangler deploy
          --config .output/server/wrangler.json
          --secrets-file "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
          --keep-vars
          --strict

      - name: Remove runtime secret file
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
