name: Cloudflare deployment implementation

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      production_confirmation:
        required: true
        type: string
      public_site_origin:
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      VITE_TURNSTILE_SITE_KEY:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      REQUEST_FINGERPRINT_KEY:
        required: true
      REQUEST_FINGERPRINT_KEY_ID:
        required: true
      IP_HASH_KEY:
        required: true
      TURNSTILE_SECRET_KEY:
        required: true
      TURNSTILE_ALLOWED_HOSTNAMES:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_ADMIN_CHAT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate manual deployment request
        shell: bash
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TARGET" == "preview" || "$DEPLOY_TARGET" == "production" ]] || {
            echo "Deployment target is invalid." >&2
            exit 1
          }
          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Production deployment is allowed only from main." >&2
              exit 1
            }
            [[ "$PRODUCTION_CONFIRMATION" == "DEPLOY_PRODUCTION" ]] || {
              echo "Production deployment confirmation is invalid." >&2
              exit 1
            }
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated content artifact
        run: bun run content:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Validate public build configuration
        shell: bash
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$VITE_TURNSTILE_SITE_KEY" ]] || {
            echo "VITE_TURNSTILE_SITE_KEY is not configured for this repository target." >&2
            exit 1
          }

      - name: Prepare deployment indexing policy
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
        run: node scripts/prepare-deploy-indexing.mjs "$DEPLOY_TARGET"

      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
        run: bun run build

      - name: Prepare Cloudflare deploy config
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Verify Cloudflare deploy artifact
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
        run: node scripts/verify-cloudflare-deploy.mjs

      - name: Write runtime secret file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_FINGERPRINT_KEY: ${{ secrets.REQUEST_FINGERPRINT_KEY }}
          REQUEST_FINGERPRINT_KEY_ID: ${{ secrets.REQUEST_FINGERPRINT_KEY_ID }}
          IP_HASH_KEY: ${{ secrets.IP_HASH_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ALLOWED_HOSTNAMES: ${{ secrets.TURNSTILE_ALLOWED_HOSTNAMES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: node scripts/write-cloudflare-secrets.mjs "$RUNNER_TEMP/cloudflare-runtime-secrets.json"

      - name: Validate Cloudflare CI credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID is not configured for this repository target." >&2
            exit 1
          }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo "CLOUDFLARE_API_TOKEN is not configured for this repository target." >&2
            exit 1
          }

      - name: Upload stable preview version without promotion
        if: ${{ inputs.target == 'preview' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@4.97.0 versions upload
          --config .output/server/wrangler.json
          --secrets-file "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
          --preview-alias staging
          --keep-vars
          --strict

      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@4.97.0 deploy
          --config .output/server/wrangler.json
          --secrets-file "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
          --keep-vars
          --strict

      - name: Remove runtime secret file
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/cloudflare-runtime-secrets.json"
