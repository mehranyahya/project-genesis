<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Mehrara Project Genesis editorial cover">
<defs>
<style>.serif{font-family:Georgia,'Times New Roman',serif;fill:#1f1f1f}.sans{font-family:Arial,sans-serif;fill:#1f1f1f}.mono{font-family:ui-monospace,Consolas,monospace;fill:#756f66}.caps{font-size:10px;font-weight:700;letter-spacing:2px}.intro{animation:enter .8s ease both}.mark{transform-origin:center;animation:turn 14s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes turn{50%{transform:rotate(6deg)}}@media(prefers-reduced-motion:reduce){.intro,.mark{animation:none}}</style>
